name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PRIMARY_NODE_VERSION: "22"
  PRIMARY_PYTHON_VERSION: "3.14"

jobs:
  # Detect changed areas alongside quick-gates. Every gated job waits on both.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      python: ${{ steps.detect.outputs.python }}
      web: ${{ steps.detect.outputs.web }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Both ends of the diff have to be present, so this is the one job
          # that cannot use the shallow checkout the rest of the workflow does.
          fetch-depth: 0

      # The classification table and its fail-open rules live in
      # scripts/ci/job_gating.py, where they are unit tested. This job installs
      # no toolchain: the script is standard library only and runs on the
      # runner's system Python.
      - name: Detect changed areas
        id: detect
        env:
          BASE_SHA: >-
            ${{ github.event_name == 'pull_request'
            && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: >-
            ${{ github.event_name == 'pull_request'
            && github.event.pull_request.head.sha || github.sha }}
          # A pull request compares against its merge base, because its base
          # branch moves on without it. A push compares the two commits, which
          # is what those commits actually did.
          MERGE_BASE: ${{ github.event_name == 'pull_request' && '1' || '' }}
        run: make ci-changed-areas base="$BASE_SHA" head="$HEAD_SHA" merge_base="$MERGE_BASE"

  quick-gates:
    name: Quick gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: CI setup
        uses: ./.github/actions/ci-setup
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          python-version: ${{ env.PRIMARY_PYTHON_VERSION }}

      - name: Run quick gates
        run: make ci-quick-gates

      - name: Summarize quick gates
        if: always()
        run: |
          {
            echo "## Quick gates"
            echo
            echo "- Python: ${{ env.PRIMARY_PYTHON_VERSION }}"
            echo "- Node.js: ${{ env.PRIMARY_NODE_VERSION }}"
            echo "- Commit: ${{ github.sha }}"
          } >> "$GITHUB_STEP_SUMMARY"

  heavy-checks:
    name: Heavy checks
    needs: [changes, quick-gates]
    # Keep one coverage run over all Python sources so the 100% threshold
    # applies to the complete package and repository scripts.
    if: needs.changes.outputs.python == 'true' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: CI setup
        uses: ./.github/actions/ci-setup
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          python-version: ${{ env.PRIMARY_PYTHON_VERSION }}

      - name: Run heavy checks
        run: make ci-heavy-checks

      # Report available coverage even after a test failure. Copy the summary
      # to the log for terminal readers. pipefail preserves failures through tee.
      - name: Summarize coverage
        if: always()
        run: |
          set -o pipefail
          make ci-coverage-summary | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Summarize heavy checks
        if: always()
        run: |
          {
            echo "## Heavy checks"
            echo
            echo "- Python: ${{ env.PRIMARY_PYTHON_VERSION }}"
            echo "- Node.js: ${{ env.PRIMARY_NODE_VERSION }}"
            echo "- Commit: ${{ github.sha }}"
          } >> "$GITHUB_STEP_SUMMARY"

  python-compatibility:
    name: Python ${{ matrix.python-version }}
    needs: [changes, quick-gates]
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: CI setup
        uses: ./.github/actions/ci-setup
        with:
          node-version: ""
          python-version: ${{ matrix.python-version }}
          install-node-deps: "false"

      - name: Test Python compatibility
        run: make test-py

  node-compatibility:
    name: Node.js ${{ matrix.node-version }}
    needs: [changes, quick-gates]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: CI setup
        uses: ./.github/actions/ci-setup
        with:
          node-version: ${{ matrix.node-version }}
          python-version: ""
          install-python-deps: "false"

      - name: Verify web compatibility
        run: make ci-web

  web-e2e:
    name: Web E2E
    needs: [changes, quick-gates]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: CI setup
        uses: ./.github/actions/ci-setup
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          python-version: ""
          install-python-deps: "false"

      - name: Test web E2E
        run: make test-e2e-container

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          path: |
            playwright-report/
            test-results/

  ci-result:
    name: CI result
    if: always()
    needs:
      - changes
      - quick-gates
      - heavy-checks
      - python-compatibility
      - node-compatibility
      - web-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      # Compare each job result with the detected areas. A skipped job fails
      # when its area requires it, and detection itself must succeed.
      # scripts/ci/job_gating.py defines and tests the result table.
      - name: Check required jobs
        env:
          PYTHON_CHANGED: ${{ needs.changes.outputs.python }}
          WEB_CHANGED: ${{ needs.changes.outputs.web }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          QUICK_GATES_RESULT: ${{ needs.quick-gates.result }}
          HEAVY_CHECKS_RESULT: ${{ needs.heavy-checks.result }}
          PYTHON_COMPATIBILITY_RESULT: ${{ needs.python-compatibility.result }}
          NODE_COMPATIBILITY_RESULT: ${{ needs.node-compatibility.result }}
          WEB_E2E_RESULT: ${{ needs.web-e2e.result }}
        run: make ci-check-results
