name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PRIMARY_NODE_VERSION: "22"
  PRIMARY_PYTHON_VERSION: "3.14"

jobs:
  # Runs alongside quick-gates rather than ahead of it, so path detection costs
  # no wall-clock time. Every gated job below waits on both.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      python: ${{ steps.detect.outputs.python }}
      web: ${{ steps.detect.outputs.web }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Both ends of the diff have to be present, so this is the one job
          # that cannot use the shallow checkout the rest of the workflow does.
          fetch-depth: 0

      # The classification table and its fail-open rules live in
      # scripts/ci/job_gating.py, where they are unit tested. This job installs
      # no toolchain: the script is standard library only and runs on the
      # runner's system Python.
      - name: Detect changed areas
        id: detect
        env:
          BASE_SHA: >-
            ${{ github.event_name == 'pull_request'
            && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: >-
            ${{ github.event_name == 'pull_request'
            && github.event.pull_request.head.sha || github.sha }}
        run: make ci-changed-areas base="$BASE_SHA" head="$HEAD_SHA"

  quick-gates:
    name: Quick gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: CI setup
        uses: ./.github/actions/ci-setup
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          python-version: ${{ env.PRIMARY_PYTHON_VERSION }}

      - name: Run quick gates
        run: make ci-quick-gates

      - name: Summarize quick gates
        if: always()
        run: |
          {
            echo "## Quick gates"
            echo
            echo "- Python: ${{ env.PRIMARY_PYTHON_VERSION }}"
            echo "- Node.js: ${{ env.PRIMARY_NODE_VERSION }}"
            echo "- Commit: ${{ github.sha }}"
          } >> "$GITHUB_STEP_SUMMARY"

  heavy-checks:
    name: Heavy checks
    needs: [changes, quick-gates]
    # Stays all-or-nothing rather than splitting by area: the 100% coverage gate
    # is computed across the whole Python surface in one run, and splitting it to
    # save a couple of minutes would weaken it.
    if: needs.changes.outputs.python == 'true' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: CI setup
        uses: ./.github/actions/ci-setup
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          python-version: ${{ env.PRIMARY_PYTHON_VERSION }}

      - name: Run heavy checks
        run: make ci-heavy-checks

      # Runs even when a suite failed, so the summary still reports whatever
      # coverage was reached before the failure. The table also goes to the log
      # because a step summary is readable only in the browser: a report that
      # went missing degrades into a note rather than an error, and that must
      # not be invisible from a terminal. pipefail keeps tee from swallowing a
      # real failure the way the redirect could not.
      - name: Summarize coverage
        if: always()
        run: |
          set -o pipefail
          make ci-coverage-summary | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Summarize heavy checks
        if: always()
        run: |
          {
            echo "## Heavy checks"
            echo
            echo "- Python: ${{ env.PRIMARY_PYTHON_VERSION }}"
            echo "- Node.js: ${{ env.PRIMARY_NODE_VERSION }}"
            echo "- Commit: ${{ github.sha }}"
          } >> "$GITHUB_STEP_SUMMARY"

  python-compatibility:
    name: Python ${{ matrix.python-version }}
    needs: [changes, quick-gates]
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: CI setup
        uses: ./.github/actions/ci-setup
        with:
          node-version: ""
          python-version: ${{ matrix.python-version }}
          install-node-deps: "false"

      - name: Test Python compatibility
        run: make test-py

  node-compatibility:
    name: Node.js ${{ matrix.node-version }}
    needs: [changes, quick-gates]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: CI setup
        uses: ./.github/actions/ci-setup
        with:
          node-version: ${{ matrix.node-version }}
          python-version: ""
          install-python-deps: "false"

      - name: Verify web compatibility
        run: make ci-web

  web-e2e:
    name: Web E2E
    needs: [changes, quick-gates]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: CI setup
        uses: ./.github/actions/ci-setup
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          python-version: ""
          install-python-deps: "false"

      - name: Test web E2E
        run: make web-e2e-container

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          path: |
            playwright-report/
            test-results/

  ci-result:
    name: CI result
    if: always()
    needs:
      - changes
      - quick-gates
      - heavy-checks
      - python-compatibility
      - node-compatibility
      - web-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      # Not "success or skipped": that would accept a job that skipped when its
      # area did change, which is exactly how a mistyped `if:` condition above
      # would turn this required check silently green. The check compares each
      # result against what the detected areas say it should have been, and the
      # detection job itself must have succeeded outright. The truth table lives
      # in scripts/ci/job_gating.py, where every row is tested.
      - name: Check required jobs
        env:
          PYTHON_CHANGED: ${{ needs.changes.outputs.python }}
          WEB_CHANGED: ${{ needs.changes.outputs.web }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          QUICK_GATES_RESULT: ${{ needs.quick-gates.result }}
          HEAVY_CHECKS_RESULT: ${{ needs.heavy-checks.result }}
          PYTHON_COMPATIBILITY_RESULT: ${{ needs.python-compatibility.result }}
          NODE_COMPATIBILITY_RESULT: ${{ needs.node-compatibility.result }}
          WEB_E2E_RESULT: ${{ needs.web-e2e.result }}
        run: make ci-check-results
