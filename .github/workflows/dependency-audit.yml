name: Dependency Audit

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: CI setup
        uses: ./.github/actions/ci-setup
        with:
          node-version: 24
          python-version: ""
          install-python-deps: "false"
      - name: npm audit
        run: make audit-node
      - name: Check if npm overrides are still needed
        run: make check-overrides

  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: CI setup
        uses: ./.github/actions/ci-setup
        with:
          python-version: "3.14"
          node-version: ""
          install-node-deps: "false"
      - name: pip audit
        run: make audit-python

  report-failure:
    needs: [npm-audit, pip-audit]
    if: failure()
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/alert-issue.yml
    with:
      title: Dependency audit failed
      label: dependency-audit
      state: open
      detail: Review the npm audit, pip audit, and override checks from this run.

  report-recovery:
    needs: [npm-audit, pip-audit]
    if: success()
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/alert-issue.yml
    with:
      title: Dependency audit failed
      label: dependency-audit
      state: close
