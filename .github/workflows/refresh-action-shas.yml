name: Refresh CI Pins

on:
  schedule:
    - cron: "0 3 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_ID: ${{ vars.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
    steps:
      - name: Check GitHub App credentials
        id: credentials
        run: |
          if [ -n "$APP_ID" ] && [ -n "$APP_PRIVATE_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub App token
        if: steps.credentials.outputs.available == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: app-token
        with:
          app-id: ${{ env.APP_ID }}
          private-key: ${{ env.APP_PRIVATE_KEY }}

      - name: Checkout repository
        if: steps.credentials.outputs.available == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Capture default branch HEAD SHA
        if: steps.credentials.outputs.available == 'true'
        id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        if: steps.credentials.outputs.available == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Update CI pins
        if: steps.credentials.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: make refresh-ci-pins

      - name: Detect workflow changes
        if: steps.credentials.outputs.available == 'true'
        id: changes
        run: |
          git add .github/workflows .github/actions .pre-commit-config.yaml Makefile package.json package-lock.json pyproject.toml
          if git diff --staged --quiet -- .github/workflows .github/actions .pre-commit-config.yaml Makefile package.json package-lock.json pyproject.toml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit changes with verified commit
        if: >-
          steps.credentials.outputs.available == 'true' &&
          steps.changes.outputs.changed == 'true'
        uses: ./.github/actions/verified-commit
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          base-branch: ${{ github.event.repository.default_branch }}
          expected-head-sha: ${{ steps.head.outputs.sha }}
          commit-headline: "Refresh CI pins"
          fallback-branch-prefix: ci/refresh-ci-pins
          pr-title: "Refresh CI pins"
          pr-body: |
            ## Summary
            - Type: CI maintenance
            - Pin GitHub Actions to full commit SHAs for reproducible runs
            - Align the Playwright package and immutable CI image
            - Refresh the exact pre-commit hook version (uv is a hand-raised floor)
          pathspec: |
            .github/workflows
            .github/actions
            .pre-commit-config.yaml
            Makefile
            package.json
            package-lock.json
            pyproject.toml

      - name: Note missing app credentials
        if: steps.credentials.outputs.available != 'true'
        run: |
          {
            echo "## Refresh CI Pins"
            echo
            echo "Skipped because APP_ID and APP_PRIVATE_KEY are not configured."
          } >> "$GITHUB_STEP_SUMMARY"
