name: Schedule Watchdog

# Checks that scheduled workflows are enabled and reports disabled ones through an alert issue.
# Runs on push to main and on manual dispatch.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    # Set once the check has run. Alert jobs use it to tell a setup failure from a disabled schedule.
    outputs:
      checked: ${{ steps.watchdog.outputs.checked }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: CI setup
        uses: ./.github/actions/ci-setup
        with:
          node-version: ""

      # Sets the checked output. An unset output selects the setup-failure alert.
      - name: Check scheduled workflow enabled states
        id: watchdog
        env:
          GH_TOKEN: ${{ github.token }}
        run: make ci-schedule-watchdog

  report-failure:
    needs: watchdog
    if: failure() && needs.watchdog.outputs.checked == 'true'
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/alert-issue.yml
    with:
      # Recovery closes the issue with this same title.
      title: Scheduled workflows are stale or disabled
      label: schedule-watchdog
      state: open
      detail: Re-enable the disabled workflow and rerun the watchdog.

  # Runs when the job failed before the watchdog finished its check.
  report-setup-failure:
    needs: watchdog
    if: failure() && needs.watchdog.outputs.checked != 'true'
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/alert-issue.yml
    with:
      # Recovery closes the issue with this same title.
      title: Scheduled workflows are stale or disabled
      label: schedule-watchdog
      state: setup-failure

  report-recovery:
    needs: watchdog
    if: success()
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/alert-issue.yml
    with:
      # Recovery closes the issue with this same title.
      title: Scheduled workflows are stale or disabled
      label: schedule-watchdog
      state: close
