name: Web Smoke

on:
  schedule:
    - cron: "0 7,19 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
    steps:
      - name: Check production URL
        id: url
        run: |
          if [ -n "$PRODUCTION_URL" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.url.outputs.available == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: CI setup
        if: steps.url.outputs.available == 'true'
        uses: ./.github/actions/ci-setup
        with:
          node-version: "22"
          python-version: ""
          install-python-deps: "false"

      - name: Run web smoke check
        if: steps.url.outputs.available == 'true'
        run: make web-smoke url="$PRODUCTION_URL"

      - name: Note missing production URL
        if: steps.url.outputs.available != 'true'
        run: |
          {
            echo "## Web Smoke"
            echo
            echo "Skipped because the PRODUCTION_URL repository variable is not configured."
          } >> "$GITHUB_STEP_SUMMARY"

  report-failure:
    needs: web-smoke
    if: failure()
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/alert-issue.yml
    with:
      title: Web smoke check failed
      label: web-smoke
      state: open
      detail: Review the app shell, security headers, and CSP report endpoint from this run.

  report-recovery:
    needs: web-smoke
    if: success()
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/alert-issue.yml
    with:
      title: Web smoke check failed
      label: web-smoke
      state: close
